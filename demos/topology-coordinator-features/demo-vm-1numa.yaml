apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: vm-1numa
spec:
  devices:
    requests:
    - name: partitions
      exactly:
        deviceClassName: numa
        count: 1
---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: demo-vm-1numa
spec:
  domain:
    cpu:
      cores: 4
      sockets: 1
      threads: 1
      numa:
        guestMappingPassthrough: {}
    memory:
      guest: 4Gi
    devices:
      disks:
      - disk:
          bus: virtio
        name: containerdisk
      - disk:
          bus: virtio
        name: cloudinitdisk
      gpus:
      - name: gpu0
        claimName: vm-1numa
        requestName: partitions
      hostDevices:
      - name: nic0
        claimName: vm-1numa
        requestName: partitions
      interfaces:
      - bridge: {}
        name: default
    machine:
      type: q35
  networks:
  - name: default
    pod: {}
  resourceClaims:
  - name: vm-1numa
    resourceClaimName: vm-1numa
  tolerations:
  - operator: Exists
  volumes:
  - containerDisk:
      image: quay.io/containerdisks/fedora:41
      imagePullPolicy: IfNotPresent
    name: containerdisk
  - cloudInitNoCloud:
      userData: |
        #cloud-config
        password: fedora
        chpasswd:
          expire: false
        ssh_pwauth: true
        packages:
        - pciutils
        - numactl
    name: cloudinitdisk
