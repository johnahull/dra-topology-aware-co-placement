apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: demo-eighth-tpl
  namespace: default
spec:
  spec:
    devices:
      requests:
      - name: partitions
        exactly:
          deviceClassName: eighth
          count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-pod-eighth
  namespace: default
spec:
  containers:
  - name: workload
    image: registry.k8s.io/pause:3.9
    resources:
      claims:
      - name: partition
  resourceClaims:
  - name: partition
    resourceClaimTemplateName: demo-eighth-tpl
