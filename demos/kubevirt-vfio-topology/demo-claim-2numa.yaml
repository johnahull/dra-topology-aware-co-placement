apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: vm-2numa
spec:
  devices:
    requests:
    - name: partitions
      exactly:
        deviceClassName: numa
        count: 2
    config:
    - opaque:
        driver: sriovnetwork.k8snetworkplumbingwg.io
        parameters:
          apiVersion: sriovnetwork.k8snetworkplumbingwg.io/v1alpha1
          kind: VfConfig
          driver: vfio-pci
