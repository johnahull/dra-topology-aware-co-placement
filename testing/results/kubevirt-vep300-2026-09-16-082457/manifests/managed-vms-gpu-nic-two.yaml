apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: amd-managed-gpu-nic-a
  namespace: default
spec:
  runStrategy: Always
  template:
    metadata:
      annotations:
        kubevirt.io/memfd: "false"
    spec:
      terminationGracePeriodSeconds: 0
      domain:
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
          - name: containerdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
          hostDevices:
          - name: connectx-vf
            claimName: gpu-nic-a
            requestName: nic0
          gpus:
          - name: amd-gpu
            claimName: gpu-nic-a
            requestName: gpu0
      networks:
      - name: default
        pod: {}
      resourceClaims:
      - name: gpu-nic-a
        managedClaimProvisionerName: vep300-gpu-nic-aligner
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/containerdisks/fedora:42
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            users:
              - name: jhull
                groups: [wheel]
                sudo: ALL=(ALL) NOPASSWD:ALL
                shell: /bin/bash
                lock_passwd: true
                ssh_authorized_keys:
                  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH/DOpMOHeqfjgoMaLACgZuIwQS8q+NZzY1DHEt5aiAY kubevirt-gpu-vm
---
