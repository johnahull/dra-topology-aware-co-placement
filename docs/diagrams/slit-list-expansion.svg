<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 -10 832.8 685.0" width="832.8" height="685.0">
<rect x="30" y="-10" width="832.8" height="685.0" fill="#ffffff"/>
<style>text { font-family: monospace; }</style>
<text x="50" y="34.0" fill="#1e1e1e" font-size="24" font-family="monospace">SLIT-Based List Expansion</text>
<text x="50" y="59.0" fill="#868e96" font-size="14" font-family="monospace">How the kernel's SLIT distance table expands scalar numaNode into a list</text>
<text x="50" y="106.0" fill="#1e1e1e" font-size="16" font-family="monospace">2-Socket Server (NPS4 Enabled)</text>
<rect x="50" y="120" width="340" height="200" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="none" opacity="1.0"/>
<text x="60" y="146.0" fill="#2f9e44" font-size="16" font-family="monospace">Socket 0</text>
<text x="60" y="164.0" fill="#868e96" font-size="12" font-family="monospace">10 = self, 12 = cross-NUMA in socket</text>
<rect x="65" y="175" width="70" height="55" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1" stroke-dasharray="none" opacity="1.0"/>
