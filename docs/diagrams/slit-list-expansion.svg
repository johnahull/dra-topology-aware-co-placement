<text x="73" y="212.0" fill="#495057" font-size="10" font-family="monospace">16 CPUs</text>
<text x="73" y="224.5" fill="#495057" font-size="10" font-family="monospace">128 GiB</text>
<rect x="145" y="175" width="70" height="55" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1" stroke-dasharray="none" opacity="1.0"/>
